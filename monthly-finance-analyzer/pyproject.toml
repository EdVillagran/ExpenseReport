[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "monthly-finance-analyzer"
version = "0.1.0"
description = "Local-first deterministic monthly finance analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "openpyxl",
  "pyyaml",
  "jinja2"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
